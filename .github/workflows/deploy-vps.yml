name: Deploy Shurkou Staging WhatsApp

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "docker/**"
      - "docker-compose.yml"
      - "Dockerfile"
      - "scripts/**"
  workflow_dispatch:

concurrency:
  group: shurkou-staging-whatsapp
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy through Dokploy
        uses: ./.github/actions/deploy-dokploy
        with:
          compose_id: La7palQ1zu2IyJweDzskx
          dokploy_api_key: ${{ secrets.DOKPLOY_API_KEY }}
